<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Zatt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    #app {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
      /* Glassmorphism mejorado */
      background: linear-gradient(135deg, rgba(30, 35, 60, 0.85) 0%, rgba(20, 25, 45, 0.9) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(100, 200, 255, 0.2);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 1px 0 rgba(255, 255, 255, 0.1) inset;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Estados con animaciones */
    #app.status-idle {
      border-color: rgba(100, 200, 255, 0.3);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(100, 200, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    #app.status-idle::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, rgba(100, 200, 255, 0.3), transparent);
      animation: rotate 4s linear infinite;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #app.status-idle:hover::before {
      opacity: 1;
    }

    #app.status-listening {
      background: linear-gradient(135deg, rgba(30, 60, 45, 0.9) 0%, rgba(20, 45, 35, 0.95) 100%);
      border-color: rgba(100, 255, 150, 0.5);
      box-shadow:
        0 0 40px rgba(100, 255, 150, 0.3),
        0 12px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: pulse-green 1.2s ease-in-out infinite;
    }

    #app.status-thinking {
      background: linear-gradient(135deg, rgba(60, 50, 30, 0.9) 0%, rgba(45, 35, 20, 0.95) 100%);
      border-color: rgba(255, 200, 100, 0.5);
      box-shadow:
        0 0 40px rgba(255, 200, 100, 0.3),
        0 12px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: pulse-orange 0.8s ease-in-out infinite;
    }

    #app.status-speaking {
      background: linear-gradient(135deg, rgba(35, 50, 80, 0.9) 0%, rgba(25, 40, 65, 0.95) 100%);
      border-color: rgba(100, 180, 255, 0.5);
      box-shadow:
        0 0 40px rgba(100, 180, 255, 0.3),
        0 12px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: pulse-blue 1s ease-in-out infinite;
    }

    /* Animaciones */
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-green {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(100, 255, 150, 0.2), 0 12px 40px rgba(0, 0, 0, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(100, 255, 150, 0.4), 0 12px 40px rgba(0, 0, 0, 0.5); }
    }

    @keyframes pulse-orange {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 200, 100, 0.2), 0 12px 40px rgba(0, 0, 0, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(255, 200, 100, 0.4), 0 12px 40px rgba(0, 0, 0, 0.5); }
    }

    @keyframes pulse-blue {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(100, 180, 255, 0.2), 0 12px 40px rgba(0, 0, 0, 0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 50px rgba(100, 180, 255, 0.4), 0 12px 40px rgba(0, 0, 0, 0.5); }
    }

    /* Inner glow */
    #app::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Icono central */
    #icon {
      width: 50%;
      height: 50%;
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    #app:hover #icon {
      transform: scale(1.1);
    }

    /* SVG Icon styles */
    .icon-svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s ease;
    }

    #app.status-idle .icon-svg { color: rgba(100, 200, 255, 0.9); }
    #app.status-listening .icon-svg { color: rgba(100, 255, 150, 0.9); }
    #app.status-thinking .icon-svg { color: rgba(255, 200, 100, 0.9); }
    #app.status-speaking .icon-svg { color: rgba(100, 180, 255, 0.9); }

    /* Estado de onda sonora */
    #waveform {
      position: absolute;
      bottom: 20%;
      display: none;
      gap: 3px;
      align-items: flex-end;
      height: 20px;
    }

    #app.status-speaking #waveform,
    #app.status-listening #waveform {
      display: flex;
    }

    .wave-bar {
      width: 4px;
      background: currentColor;
      border-radius: 2px;
      animation: wave 0.6s ease-in-out infinite;
    }

    .wave-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
    .wave-bar:nth-child(2) { height: 12px; animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { height: 8px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 15px; animation-delay: 0.15s; }
    .wave-bar:nth-child(5) { height: 10px; animation-delay: 0.05s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); opacity: 0.7; }
      50% { transform: scaleY(1.5); opacity: 1; }
    }

    /* Tooltip mejorado */
    #tooltip {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 30, 0.95);
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      border: 1px solid rgba(100, 200, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }

    #app:hover #tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #tooltip::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid rgba(10, 15, 30, 0.95);
    }

    /* Controles */
    #controls {
      position: absolute;
      top: -30px;
      right: -10px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: all 0.2s ease;
      transform: translateY(5px);
    }

    #app:hover #controls {
      opacity: 1;
      transform: translateY(0);
    }

    .control-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(20, 25, 45, 0.95);
      border: 1px solid rgba(100, 200, 255, 0.3);
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .control-btn:hover {
      background: rgba(100, 200, 255, 0.2);
      border-color: rgba(100, 200, 255, 0.5);
      color: #fff;
      transform: scale(1.1);
    }

    .control-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    /* Indicador de estado */
    #status-indicator {
      position: absolute;
      top: 15%;
      right: 15%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(100, 200, 255, 0.8);
      box-shadow: 0 0 10px currentColor;
      transition: all 0.3s ease;
    }

    #app.status-idle #status-indicator {
      background: rgba(100, 200, 255, 0.6);
      box-shadow: 0 0 8px rgba(100, 200, 255, 0.4);
      animation: breathe 2s ease-in-out infinite;
    }

    #app.status-listening #status-indicator {
      background: rgba(100, 255, 150, 0.9);
      box-shadow: 0 0 15px rgba(100, 255, 150, 0.6);
      animation: blink 1s ease-in-out infinite;
    }

    #app.status-thinking #status-indicator {
      background: rgba(255, 200, 100, 0.9);
      box-shadow: 0 0 15px rgba(255, 200, 100, 0.6);
      animation: spin 1s linear infinite;
    }

    #app.status-speaking #status-indicator {
      background: rgba(100, 180, 255, 0.9);
      box-shadow: 0 0 15px rgba(100, 180, 255, 0.6);
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app" class="status-idle">
    <div id="controls">
      <div class="control-btn" id="btn-settings" title="Ajustes">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </div>
      <div class="control-btn" id="btn-close" title="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <div id="status-indicator"></div>

    <div id="icon">
      <!-- Mic Icon -->
      <svg class="icon-svg" id="icon-mic" viewBox="0 0 24 24">
        <path d="M12 19v3M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
      <!-- Brain Icon (hidden by default) -->
      <svg class="icon-svg" id="icon-brain" viewBox="0 0 24 24" style="display: none;">
        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.96-3A2.5 2.5 0 0 1 9.5 2Z"/>
        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.96-3A2.5 2.5 0 0 0 14.5 2Z"/>
      </svg>
      <!-- Speaking Icon (hidden by default) -->
      <svg class="icon-svg" id="icon-speak" viewBox="0 0 24 24" style="display: none;">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>

    <div id="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <div id="tooltip">Zatt te escucha</div>
  </div>
  <script type="module" src="./app.ts"></script>
</body>
</html>
